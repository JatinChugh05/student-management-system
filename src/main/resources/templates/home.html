
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
        }

        nav {
            background-color: #0d2b4d;
            padding: 18px 50px;
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 20px;
        }

        .welcome-box {
            background-color: white;
            padding: 60px 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .welcome-box h1 {
            color: #14213d;
            margin-bottom: 15px;
        }

        .welcome-box p {
            color: #555;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            font-size: 15px;
        }

        .btn-primary {
            background-color: #0d6efd;
        }

        .btn-success {
            background-color: #198754;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Student Management System</div>

    <a th:href="@{/}">Home</a>
    <a th:href="@{/students}">Students</a>
</nav>

<div class="container">

    <div class="welcome-box">

        <h1>Welcome to Student Management System</h1>

        <p>Manage your students easily.</p>

        <a th:href="@{/students}" class="btn btn-success">
            View All Students
        </a>

        <a th:href="@{/students/add}" class="btn btn-primary">
            Add New Student
        </a>

    </div>

</div>

</body>
</html>
