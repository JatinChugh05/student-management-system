<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
        }

        nav {
            background-color: #0d2b4d;
            padding: 18px 50px;
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-box {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #14213d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0d6efd;
        }

        .button-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background-color: #0d6efd;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .button-container a {
            display: inline-block;
            padding: 12px 25px;
            margin-left: 8px;
            border-radius: 5px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        button:hover,
        .button-container a:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        Student Management System
    </div>

    <a th:href="@{/}">
        Home
    </a>

    <a th:href="@{/students}">
        Students
    </a>

</nav>


<div class="container">

    <div class="form-box">

        <h1>Update Student</h1>

        <form th:action="@{/students/update}"
              th:object="${student}"
              method="post">

            <!--
                Very important:
                Keep the existing student's ID while submitting
                the updated information.
            -->
            <input type="hidden" th:field="*{id}">


            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter student name">

            </div>


            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input type="text"
                       id="city"
                       th:field="*{city}"
                       placeholder="Enter city">

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Enter email">

            </div>


            <div class="form-group">

                <label for="phoneNo">
                    Phone Number
                </label>

                <input type="text"
                       id="phoneNo"
                       th:field="*{phoneNo}"
                       placeholder="Enter phone number">

            </div>


            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender" th:field="*{gender}">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="branch">
                    Branch
                </label>

                <select id="branch" th:field="*{branch}">

                    <option value="">
                        Select Branch
                    </option>

                    <option value="CSE">
                        CSE
                    </option>

                    <option value="ECE">
                        ECE
                    </option>

                    <option value="IT">
                        IT
                    </option>

                    <option value="ME">
                        ME
                    </option>


                </select>

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" th:field="*{category}">

                    <option value="">
                        Select Category
                    </option>

                    <option value="General">
                        General
                    </option>

                    <option value="OBC">
                        OBC
                    </option>

                    <option value="SC">
                        SC
                    </option>

                    <option value="ST">
                        ST
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="year">
                    Year
                </label>

                <select id="year" th:field="*{year}">

                    <option value="">
                        Select Year
                    </option>

                    <option value="1">
                        1st Year
                    </option>

                    <option value="2">
                        2nd Year
                    </option>

                    <option value="3">
                        3rd Year
                    </option>

                    <option value="4">
                        4th Year
                    </option>

                </select>

            </div>


            <div class="button-container">

                <button type="submit">
                    Update Student
                </button>

                <a th:href="@{/students}">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
